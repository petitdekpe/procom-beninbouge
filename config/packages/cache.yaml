framework:
    cache:
        # Unique name of your app: used to compute stable namespaces for cache keys.
        #prefix_seed: your_vendor_name/app_name

        # The "app" cache stores to the filesystem by default.
        # The data in this cache should persist between deploys.
        # Other options include:

        # Redis
        #app: cache.adapter.redis
        #default_redis_provider: redis://localhost

        # APCu (not recommended with heavy random-write workloads as memory fragmentation can cause perf issues)
        #app: cache.adapter.apcu

        # Dedicated pool used to cache the Article/Category listing queries
        # (see App\State\CachedArticleCollectionProvider and
        # App\State\CachedCategoryCollectionProvider). Filesystem-backed so it
        # works without any extra service: a Redis outage/absence used to make
        # every admin write (save, trash, category edit) fail with a 500 when
        # it called $listingsCache->clear(). To go back to Redis, set
        # adapter: cache.adapter.redis and provider: '%env(REDIS_URL)%'.
        pools:
            cache.listings:
                adapter: cache.adapter.filesystem
                default_lifetime: 60
