# Enable stateless CSRF protection for forms and logins/logouts
framework:
    form:
        csrf_protection:
            token_id: submit

    csrf_protection:
        stateless_token_ids:
            - submit
            - authenticate
            - logout
            # Formulaires publics « Nous joindre » et newsletter (footer, présent
            # sur toutes les pages) : sans état pour ne pas ouvrir de session
            # chez chaque visiteur.
            - contact
            - newsletter
