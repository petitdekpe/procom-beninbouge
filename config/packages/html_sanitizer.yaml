# Nettoyage du HTML saisi dans l'éditeur riche des annonces (filtre Twig
# rich_text, App\Twig\RichTextExtension) : seules les balises de mise en
# forme de l'éditeur sont gardées, tout script ou attribut d'événement est
# retiré avant affichage.
framework:
    html_sanitizer:
        sanitizers:
            app.rich_text_sanitizer:
                allow_elements:
                    p: []
                    br: []
                    strong: []
                    b: []
                    em: []
                    i: []
                    u: []
                    s: []
                    h2: []
                    h3: []
                    blockquote: []
                    ul: []
                    ol: []
                    li: []
                    a: ['href', 'title']
                    img: ['src', 'alt']
                allowed_link_schemes: ['http', 'https', 'mailto', 'tel']
                allowed_media_schemes: ['http', 'https']
                allow_relative_links: true
                allow_relative_medias: true
                force_attributes:
                    a:
                        rel: 'noopener nofollow'
                        target: '_blank'
